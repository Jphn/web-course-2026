<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}">Meu App</a></h1>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('about') }}">Sobre</a>
            <a href="{{ url_for('contact') }}">Contato</a>
            <a href="{{ url_for('items') }}">Itens</a>
        </nav>
    </header>

    <main>
        {% from 'macros.html' import flash_messages %}
        {{ flash_messages() }}
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    {% block scripts %}{% endblock %}
</body>
</html>
